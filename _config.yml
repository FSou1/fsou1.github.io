# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Maxim Zhukov"
masthead_title: " "
email: maxim.zhukov.dev@gmail.com
description: >- # this means to ignore newlines until "url:"
  Engineering blog of Maxim Zhukov, Staff Software Engineer and Frontend
  Architect at PayPal. Posts on frontend architecture, React, TypeScript,
  design systems, web performance, testing, and .NET.
url: "https://fsou1.github.io"
baseurl: ""
locale: "en-US"
google_site_verification: "qvyg7YGJSrbR3Cc4u_qwqZIlWe170Lq6kOWMh7-eEGM"
og_image: /assets/images/bio-photo.png
og_image_alt: "Maxim Zhukov"
# Used by _includes/head/custom.html to build the Person structured data (JSON-LD)
social:
  type: Person
  name: "Maxim Zhukov"
  job_title: "Staff Software Engineer"
  works_for: "PayPal"
  knows_about:
    - Frontend architecture
    - React
    - TypeScript
    - Design systems
    - Web performance
    - Visual regression testing
    - Node.js
    - .NET
  links:
    - "https://www.linkedin.com/in/maxim-zhukov-dev/"
    - "https://github.com/FSou1"
    - "https://www.youtube.com/@SeasonedDev"
    - "https://t.me/seasoneddev"

github_username: fsou1
minimal_mistakes_skin: default
search: true
logo: /assets/images/logo.png
repository: "FSou1/fsou1.github.io"
comments:
  provider: "giscus"
  giscus:
    repo_id: "MDEwOlJlcG9zaXRvcnk1ODg1Mjc2MQ=="
    category_name: "Announcements"
    category_id: "DIC_kwDOA4IFmc4DLRQt"
    discussion_term: "pathname"
    reactions_enabled: "1"
    input_position: "top"
    theme: "light"
    lazy: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-redirect-from

author:
  name: "Maxim Zhukov"
  avatar: "/assets/images/bio-photo.png"
  bio: "Software Engineer, MSCS graduate, passionate about programming ❤️"
  location: "Houston, TX"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:maxim.zhukov.dev@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/maxim-zhukov-dev/"
    - label: "CV / Resume"
      icon: "fas fa-fw fa-file"
      url: "/assets/Maxim_Zhukov_Resume.pdf"
    - label: "Contact"
      icon: "fas fa-fw fa-link"
      url: "/contact/"

footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:maxim.zhukov.dev@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/maxim-zhukov-dev/"
    - label: "CV / Resume"
      icon: "fas fa-fw fa-file"
      url: "/assets/Maxim_Zhukov_Resume.pdf"
    - label: "Contact"
      icon: "fas fa-fw fa-link"
      url: "/contact/"

collections:
  experience:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: post-cta
      classes: wide
      author_profile: true
      read_time: true
      comments: true
      share: false
      related: true
      show_date: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _experience
  - scope:
      path: ""
      type: experience
    values:
      layout: single
      author_profile: false
      share: true
      classes: wide
  # _projects
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
      share: true
      classes: wide

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
